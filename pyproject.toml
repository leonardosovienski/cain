[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cain-research"
version = "0.4.13rc4"
description = "Assistente experimental com identidade persistente e agentes locais"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "predictor-research-snapshot==1.0.2rc1",
  "predictor-research-bundle==1.0.1rc1",
  "predictor-research-protocol==1.0.3rc1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
vision = ["Pillow>=11,<13"]

[project.scripts]
cain = "cain.cli:main"
cain-mcp = "cain.mcp:main"
cain-stream = "cain.playground:main"

[tool.uv.sources]
predictor-research-snapshot = { url = "https://github.com/leonardosovienski/ecosystem-predictor/releases/download/predictor-research-snapshot-v1.0.2rc1/predictor_research_snapshot-1.0.2rc1-py3-none-any.whl" }
predictor-research-bundle = { url = "https://github.com/leonardosovienski/ecosystem-predictor/releases/download/predictor-research-bundle-v1.0.1rc1/predictor_research_bundle-1.0.1rc1-py3-none-any.whl" }
predictor-research-protocol = { url = "https://github.com/leonardosovienski/ecosystem-predictor/releases/download/predictor-research-protocol-v1.0.3rc1/predictor_research_protocol-1.0.3rc1-py3-none-any.whl" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cain = ["web/*.html", "web/*.css", "web/*.js", "evaluation/data/scenarios/*.json", "evaluation/data/probes/*.json", "evaluation/data/rubrics/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# docs/ holds dated evidence, including preserved scripts; it is not lintable code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Informational only (CI job "typecheck" never blocks). Debt recorded on 2026-09-24:
# 49 errors in 13 files, mostly var-annotated (15), arg-type (10), assignment (6).
python_version = "3.11"
ignore_missing_imports = true
files = ["src/cain"]
