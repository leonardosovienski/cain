name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --locked --extra dev --extra vision
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m cain --help
      - run: uv build --wheel --out-dir dist
      - name: Verify noneditable distribution outside checkout
        shell: bash
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file lock-requirements.txt
          uv run --locked python tools/verify_wheel.py --wheel dist/cain_research-*.whl --requirements lock-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cain-wheel-${{ matrix.python-version }}
          path: dist/*.whl
