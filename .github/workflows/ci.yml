name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-index vendor/predictor_research_snapshot-*.whl vendor/predictor_research_bundle-*.whl
      - run: python -m pip install -e '.[dev,vision]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m cain --help
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify noneditable distribution outside checkout
        shell: bash
        run: python tools/verify_wheel.py --wheel dist/cain_research-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cain-wheel-${{ matrix.python-version }}
          path: dist/*.whl
