name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --find-links vendor -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m cain --help
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify noneditable distribution outside checkout
        shell: bash
        run: python tools/verify_wheel.py --wheel dist/cain_research-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cain-wheel-${{ matrix.python-version }}
          path: dist/*.whl
