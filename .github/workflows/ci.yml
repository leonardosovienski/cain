name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  # Stack wheels (predictor-research-*) are GitHub Release assets of private repositories (STACK_WHEELS.json).
  # STACK_READ_TOKEN: fine-grained token, Contents: read on each producer repository. Without it the fetch
  # step fails closed with the reason; GITHUB_TOKEN cannot read another repository's releases.
  STACK_READ_TOKEN: ${{ secrets.STACK_READ_TOKEN }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
      - name: Stack wheels from the registry (GitHub Releases, sha256-verified)
        run: uv run --no-project python tools/stack_wheels.py fetch
      - run: uv lock --check
      - run: uv sync --locked --extra dev --extra vision --extra observability
      - run: uv run --no-project python tools/stack_wheels.py check
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m cain --help
      - run: uv build --wheel --out-dir dist
      - name: Verify noneditable distribution outside checkout
        shell: bash
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file lock-requirements.txt
          uv run --no-project python tools/stack_wheels.py requirements --input lock-requirements.txt --output lock-requirements.hashed.txt
          uv run --locked python tools/verify_wheel.py --wheel dist/cain_research-*.whl --requirements lock-requirements.hashed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cain-wheel-${{ matrix.python-version }}
          path: dist/*.whl

  # Coverage gate on ONE fixed job (Linux, Python 3.12): coverage varies across Python
  # versions and operating systems (skipped tests, platform branches), so the matrix
  # above never gates on it. The floor is the Phase 0 baseline reproduced on main
  # (86%, rounded down; started at 84%). To raise it: run `uv run --locked pytest -q --cov=cain` on main,
  # take the TOTAL rounded down to an integer, and update --cov-fail-under in the same
  # PR that lifted the coverage. Never lower it without a written reason in the PR.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: '3.12'
      - name: Stack wheels from the registry (GitHub Releases, sha256-verified)
        run: uv run --no-project python tools/stack_wheels.py fetch
      - run: uv sync --locked --extra dev --extra vision --extra observability
      - run: uv run --locked pytest -q --cov=cain --cov-report=term --cov-fail-under=86

  # Type checker, blocking since 2026-09-29: the debt (49 errors in 13 files at introduction,
  # 85 in 25 files that morning) was paid down to zero; a new error fails the job.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: '3.12'
      - name: Stack wheels from the registry (GitHub Releases, sha256-verified)
        run: uv run --no-project python tools/stack_wheels.py fetch
      - run: uv sync --locked --extra dev --extra vision --extra observability
      - name: "mypy (blocking since 2026-09-29; the debt was paid down to zero)"
        run: uv run --locked --with mypy mypy

  # Full test suite on Windows: the two launcher tests marked "Windows launcher only" and
  # every platform-specific branch (paths, junctions, sqlite locking) run here for real.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: '3.12'
      - name: Stack wheels from the registry (GitHub Releases, sha256-verified)
        run: uv run --no-project python tools/stack_wheels.py fetch
      - run: uv sync --locked --extra dev --extra vision --extra observability
      - run: uv run --no-project python tools/stack_wheels.py check
      - run: uv run --locked pytest -q -p no:cacheprovider

  # Windows smoke: the documented launcher flow on a fresh checkout, without Ollama.
  # scripts/start-cain.ps1 fetches the stack wheels (STACK_WHEELS.json) and installs from uv.lock (uv on PATH) when .venv is absent and
  # then runs `cain doctor`. Without an Ollama service, doctor exits 1 after printing
  # "Cain: <urlopen error ...>", which already proves the install and the start-up;
  # any other failure (missing uv, uv sync error, import error, traceback) fails the job.
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: '3.12'
      - name: Launcher in doctor mode (installs .venv from uv.lock, no Ollama)
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/start-cain.ps1 -Mode doctor 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if (-not (Test-Path .venv/Scripts/python.exe)) { throw "launcher did not create .venv" }
          if ($output -match 'Traceback') { throw "launcher raised a Python traceback" }
          $doctorRan = ($output -match '"model_available"') -or ($output -match 'Cain: <urlopen error')
          if (-not $doctorRan) { throw "cain doctor did not run (exit $code)" }
          if ($code -ne 0 -and -not ($output -match 'Cain: <urlopen error')) { throw "doctor failed for another reason (exit $code)" }
          # The checks above decide the outcome; GitHub's pwsh wrapper would otherwise re-raise doctor's exit 1.
          exit 0
      - name: Installed package answers --help
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -X utf8 -m cain --help
          if ($LASTEXITCODE -ne 0) { throw "python -m cain --help failed" }
      - name: No background processes left behind
        shell: pwsh
        run: |
          $left = Get-Process -Name ollama, uvicorn -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table; throw "launcher left processes running" }
