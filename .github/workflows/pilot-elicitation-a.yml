name: Pilot elicitation A (prompt-only)
on:
  push:
    branches: [claude/cain-scientific-validation-nw9doc]
    paths: [pilots/elicitation-a/TRIGGER, pilots/elicitation-a/TRIGGER_FRONTIER, pilots/elicitation-a/v2/TRIGGER_V2]
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag
        default: qwen2.5:7b-instruct-q4_K_M
      run_id:
        description: run id (default = model + GitHub run id)
        default: ""
permissions:
  contents: write
env:
  MODEL: ${{ inputs.model || 'qwen2.5:7b-instruct-q4_K_M' }}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip the local-model job on a frontier-only trigger
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx 'pilots/elicitation-a/TRIGGER'; then echo "local trigger"; else echo "::notice::TRIGGER unchanged; local job stops here"; exit 0; fi
          echo "LOCAL_GO=yes" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: env.LOCAL_GO == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.13"
      - name: Install and start Ollama (CPU)
        if: env.LOCAL_GO == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama --version
          nproc; free -g
      - name: Pull model
        if: env.LOCAL_GO == 'yes' || github.event_name == 'workflow_dispatch'
        run: ollama pull "$MODEL"
      - name: Run pilot
        if: env.LOCAL_GO == 'yes' || github.event_name == 'workflow_dispatch'
        id: run
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then RUN_ID="$(echo "$MODEL" | tr ':/' '--')-gha${GITHUB_RUN_ID}"; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python pilots/elicitation-a/run_pilot.py --run-id "$RUN_ID" --provider ollama --model "$MODEL"
          python pilots/elicitation-a/label.py "pilots/elicitation-a/runs/$RUN_ID"
          python pilots/elicitation-a/summarize.py "pilots/elicitation-a/runs/$RUN_ID"
          cp ollama-serve.log "pilots/elicitation-a/runs/$RUN_ID/ollama-serve.log"
      - uses: actions/upload-artifact@v4
        if: always() && steps.run.outputs.run_id != ''
        with:
          name: pilot-elicitation-a-${{ steps.run.outputs.run_id }}
          path: pilots/elicitation-a/runs/${{ steps.run.outputs.run_id }}
      - name: Commit raw results to the branch
        if: always() && steps.run.outputs.run_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/elicitation-a/runs
          git commit -m "pilot(elicitation-a): raw results of ${{ steps.run.outputs.run_id }}" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
  frontier:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only when TRIGGER_FRONTIER changed in this push
        id: gate
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx 'pilots/elicitation-a/TRIGGER_FRONTIER'; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: Require the API key secret (fail fast, zero cost)
        if: steps.gate.outputs.go == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::secret ANTHROPIC_API_KEY is not set in this repository; frontier run blocked"; exit 78; fi
          echo "secret present"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.13"
      - name: Run frontier pilot (same frozen files; only the model changes)
        if: steps.gate.outputs.go == 'yes'
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRONTIER_MODEL: claude-opus-5-5
        run: |
          pip install -q "anthropic==1.11.0"
          test -d pilots/elicitation-a/v2/frozen || { echo "::error::v2/frozen missing"; exit 1; }
          RUN_ID="v2-$(echo "$FRONTIER_MODEL" | tr ':/' '--')-gha${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python pilots/elicitation-a/run_pilot.py --run-id "$RUN_ID" --provider anthropic --model "$FRONTIER_MODEL" \
            --frozen-dir pilots/elicitation-a/v2/frozen --system-prompt system_prompt_v2.txt --runs-dir pilots/elicitation-a/v2/runs
          python pilots/elicitation-a/label.py "pilots/elicitation-a/v2/runs/$RUN_ID"
          python pilots/elicitation-a/v2/frozen/relabel_run.py "pilots/elicitation-a/v2/runs/$RUN_ID"
          python pilots/elicitation-a/v2/frozen/check_user_prompts.py "pilots/elicitation-a/v2/runs/$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'yes' && steps.run.outputs.run_id != ''
        with:
          name: pilot-elicitation-a-${{ steps.run.outputs.run_id }}
          path: pilots/elicitation-a/v2/runs/${{ steps.run.outputs.run_id }}
      - name: Commit raw results to the branch
        if: always() && steps.gate.outputs.go == 'yes' && steps.run.outputs.run_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/elicitation-a/v2/runs
          git commit -m "pilot(elicitation-a): raw results of ${{ steps.run.outputs.run_id }}" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
  pilot-v2:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only when v2/TRIGGER_V2 changed in this push
        id: gate
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx 'pilots/elicitation-a/v2/TRIGGER_V2'; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.13"
      - name: Install and start Ollama 0.40.0 (CPU, pinned to the V1 version)
        if: steps.gate.outputs.go == 'yes'
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.0 sh
          nohup ollama serve > ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama --version; nproc; free -g
      - name: Pull model and assert the V1 digest
        if: steps.gate.outputs.go == 'yes'
        run: |
          ollama pull "$MODEL"
          DIGEST=$(curl -s http://127.0.0.1:11434/api/tags | python3 -c "import json,sys,os; m=[x for x in json.load(sys.stdin)['models'] if x['name']==os.environ['MODEL']]; print(m[0]['digest'] if m else '')")
          test "$DIGEST" = "845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e" || { echo "::error::model digest $DIGEST differs from V1"; exit 1; }
      - name: Run V2 (frozen v2/, same model, same harness)
        if: steps.gate.outputs.go == 'yes'
        id: run
        run: |
          test -d pilots/elicitation-a/v2/frozen || { echo "::error::v2/frozen missing: not frozen"; exit 1; }
          RUN_ID="v2-$(echo "$MODEL" | tr ':/' '--')-gha${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python pilots/elicitation-a/run_pilot.py --run-id "$RUN_ID" --provider ollama --model "$MODEL" \
            --frozen-dir pilots/elicitation-a/v2/frozen --system-prompt system_prompt_v2.txt --runs-dir pilots/elicitation-a/v2/runs
          python pilots/elicitation-a/label.py "pilots/elicitation-a/v2/runs/$RUN_ID"
          python pilots/elicitation-a/v2/frozen/relabel_run.py "pilots/elicitation-a/v2/runs/$RUN_ID"
          python pilots/elicitation-a/v2/frozen/check_user_prompts.py "pilots/elicitation-a/v2/runs/$RUN_ID"
          cp ollama-serve.log "pilots/elicitation-a/v2/runs/$RUN_ID/ollama-serve.log"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.go == 'yes' && steps.run.outputs.run_id != ''
        with:
          name: pilot-elicitation-a-${{ steps.run.outputs.run_id }}
          path: pilots/elicitation-a/v2/runs/${{ steps.run.outputs.run_id }}
      - name: Commit raw results to the branch
        if: always() && steps.gate.outputs.go == 'yes' && steps.run.outputs.run_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/elicitation-a/v2/runs
          git commit -m "pilot(elicitation-a) v2: raw results of ${{ steps.run.outputs.run_id }}" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
