# Recalcula o uv.lock num runner com acesso a todos os índices (o índice pytorch-cpu não é
# alcançável de alguns ambientes de desenvolvimento) e mostra o diff no log; nada é commitado.
name: Relock (diagnóstico)

on:
  workflow_dispatch:
  push:
    paths: [uv.lock, pyproject.toml, STACK_WHEELS.json, .github/workflows/relock.yml]

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: "3.12"
      - name: Stack wheels from the registry (the lock resolves predictor-research-* from .stack-wheels)
        env:
          STACK_READ_TOKEN: ${{ secrets.STACK_READ_TOKEN || github.token }}
        run: uv run --no-project python tools/stack_wheels.py fetch
      - run: uv lock
      - run: git --no-pager diff -- uv.lock
      - uses: actions/upload-artifact@v4
        with:
          name: uv.lock
          path: uv.lock
